<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ZPL Converter Online</title>
</head>
<body>
    <h2>ZPL Converter Online</h2>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        <label>
            <input type="radio" name="mode" value="to_zpl" checked onchange="toggleFields()"> Imagem → ZPL
        </label>
        <label>
            <input type="radio" name="mode" value="from_zpl" onchange="toggleFields()"> ZPL → Imagem
        </label>
        <br><br>
        <input type="file" name="file" required><br><br>
        <div id="params">
            Largura (cm): <input type="number" step="0.1" name="largura" value="10"><br>
            Altura (cm): <input type="number" step="0.1" name="altura" value="5"><br>
            Quantidade: <input type="number" name="quantidade" value="1"><br>
        </div>
        <br>
        <button type="submit">Processar</button>
    </form>
    {% if result_file %}
        <p><a href="{{ result_file }}">Baixar resultado</a></p>
    {% endif %}
    <script>
        function toggleFields() {
            var mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('params').style.display = (mode === 'to_zpl') ? 'block' : 'none';
        }
        toggleFields();
    </script>
</body>
</html>
